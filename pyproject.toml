[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcfunction-interpreter"
version = "0.1.0"
description = "Minecraft mcfunction datapack interpreter"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Minecraft Datapack Developers", email = "dev@example.com"}
]
dependencies = [
    "lark>=1.1.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0,<8.0.0",
    "pytest-cov>=4.0.0,<5.0.0",
    "mypy>=1.0.0,<2.0.0",
    "ruff>=0.1.0,<0.2.0",
]

[project.scripts]
mcfun = "mcfunction.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "Q",
]
ignore = []

[tool.ruff.isort]
combine-as-imports = true

[tool.hatch.build.targets.wheel]
packages = ["mcfunction"]
